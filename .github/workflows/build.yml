# GitHub Actions CI/CD — System Architecture
#
# Builds standalone executables for Linux and Windows using PyInstaller
# on every push to main (and on pull requests).
#
# ── Release behaviour ──────────────────────────────────────────
#   Tag push (v*)  → Creates a proper versioned release with
#                     auto-generated release notes.
#   Normal push    → Creates/updates a moving "nightly" pre-release
#                     so you always have the latest binaries available
#                     as a downloadable release, not just artifacts.
#
# ── Secrets ────────────────────────────────────────────────────
#   (none required — the built app prompts the user for DB config
#    on first run; credentials are never baked into the binary.)

name: Build CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# ── Concurrency ────────────────────────────────────────────────
# Cancel any in-progress run for the same branch — saves runner
# minutes when you push a fix before the previous build finished.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  LINUX BUILD  (Ubuntu 24.04 LTS)
  # ═══════════════════════════════════════════════════════════════
  build-linux:
    name: 🐧 Linux (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 📦 Install system dependencies (Qt / WebEngine)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1                  \
            libgl1                   \
            libxcb-icccm4            \
            libxcb-image0            \
            libxcb-keysyms1          \
            libxcb-randr0            \
            libxcb-render-util0      \
            libxcb-shape0            \
            libxcb-xfixes0           \
            libxcb-xkb1              \
            libxkbcommon-x11-0       \
            libxkbcommon0            \
            libdbus-1-3

      - name: 🐍 Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt

      - name: 🏗️ Install PyInstaller
        run: pip install 'pyinstaller>=6.0'

      - name: 🔨 Build with PyInstaller
        run: |
          python build_app.py --name SystemArchitecture

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemArchitecture-Linux
          path: dist/SystemArchitecture
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════
  #  WINDOWS BUILD  (Windows Server 2022)
  # ═══════════════════════════════════════════════════════════════
  build-windows:
    name: 🪟 Windows (Server 2022)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 🐍 Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt

      - name: 🏗️ Install PyInstaller
        run: pip install 'pyinstaller>=6.0'

      - name: 🔨 Build with PyInstaller
        run: |
          python build_app.py --name SystemArchitecture

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemArchitecture-Windows
          path: dist/SystemArchitecture.exe
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════
  #  RELEASE  — runs on every push to main (tagged or not)
  # ═══════════════════════════════════════════════════════════════
  release:
    name: 📦 Create Release
    needs: [build-linux, build-windows]
    # Only runs on push events (not pull_request) to main or tags
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checkout is REQUIRED — gh release create reads the git
      # remote to determine owner/repo. Without it you get:
      #   "fatal: not a git repository"
      - name: 📥 Checkout (for git context)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for --generate-notes to compare tags

      - name: 📥 Download all build artifacts
        uses: actions/download-artifact@v4

      # ── VERSIONED RELEASE  (tag push like v1.0.0) ──────────────
      - name: 📦 Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            SystemArchitecture-Linux/SystemArchitecture \
            SystemArchitecture-Windows/SystemArchitecture.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── CONTINUOUS / NIGHTLY RELEASE  (branch push to main) ───
      # Creates or updates a moving "nightly" pre-release so the
      # latest build is always one click away on the Releases page.
      - name: 📦 Create/update nightly pre-release
        if: github.ref_name == 'main'
        run: |
          # Delete previous nightly release + tag (ignore if missing)
          gh release delete nightly --yes 2>/dev/null || true
          git tag -f nightly
          git push -f origin nightly

          gh release create nightly \
            --title "Nightly Build (${{ github.sha }})" \
            --prerelease \
            --notes "Auto-built from commit [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" \
            SystemArchitecture-Linux/SystemArchitecture \
            SystemArchitecture-Windows/SystemArchitecture.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
