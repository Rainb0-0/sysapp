# GitHub Actions CI/CD — System Architecture
#
# Builds standalone executables for Linux and Windows using PyInstaller
# whenever code is pushed to main (and on pull requests to main).
#
# The built artifacts are uploaded as workflow artifacts so you can
# download them from the Actions tab on GitHub without needing to
# build locally.
#
# ── Trigger ────────────────────────────────────────────────────
#   push          → main branch (every merge/commit)
#   pull_request  → main branch (verify the build before merging)
#
# ── Release ────────────────────────────────────────────────────
#   Tag a commit with `v*` (e.g. `git tag v1.0.0 && git push --tags`)
#   and the release job will create a GitHub Release with both
#   binaries attached — zero extra effort.
#
# ── Secrets ────────────────────────────────────────────────────
#   (none required — the built app prompts the user for DB config
#    on first run; credentials are never baked into the binary.)

name: Build CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# ── Concurrency ────────────────────────────────────────────────
# Cancel any in-progress run for the same branch — saves runner
# minutes when you push a fix before the previous build finished.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  LINUX BUILD  (Ubuntu 24.04 LTS)
  # ═══════════════════════════════════════════════════════════════
  build-linux:
    name: 🐧 Linux (Ubuntu)
    runs-on: ubuntu-24.04
    # Give ourselves room — PyInstaller + WebEngine is heavy
    timeout-minutes: 30

    steps:
      # 1. Check out the repository
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # 2. Set up Python 3.10 (the project requires ≥3.9)
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      # 3. Install system-level libraries that Qt / WebEngine need
      #    at runtime. PyQt5 wheels bundle their own Qt, but they
      #    still link against system EGL, GL, XCB, and xkbcommon.
      - name: 📦 Install system dependencies (Qt / WebEngine)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1                  \
            libgl1                   \
            libxcb-icccm4            \
            libxcb-image0            \
            libxcb-keysyms1          \
            libxcb-randr0            \
            libxcb-render-util0      \
            libxcb-shape0            \
            libxcb-xfixes0           \
            libxcb-xkb1              \
            libxkbcommon-x11-0       \
            libxkbcommon0            \
            libdbus-1-3

      # 4. Install Python dependencies (runtime)
      - name: 🐍 Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt

      # 5. Install PyInstaller (build-time only)
      - name: 🏗️ Install PyInstaller
        run: pip install 'pyinstaller>=6.0'

      # 6. Run the project's own build script
      #    --name  controls the output executable filename
      #    --console  keeps a terminal attached (useful for debugging
      #               if the binary crashes on the user's machine)
      #    The script defaults to --onefile and --windowed unless
      #    you pass --onedir / --console respectively.
      - name: 🔨 Build with PyInstaller
        run: |
          python build_app.py --name SystemArchitecture

      # 7. Upload the single-file executable as a workflow artifact
      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemArchitecture-Linux
          path: dist/SystemArchitecture
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════
  #  WINDOWS BUILD  (Windows Server 2022)
  # ═══════════════════════════════════════════════════════════════
  build-windows:
    name: 🪟 Windows (Server 2022)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      # On Windows, PyQt5 wheels for win_amd64 ship with all needed
      # Qt DLLs, so no extra system packages are required.
      - name: 🐍 Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt

      - name: 🏗️ Install PyInstaller
        run: pip install 'pyinstaller>=6.0'

      - name: 🔨 Build with PyInstaller
        run: |
          python build_app.py --name SystemArchitecture

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemArchitecture-Windows
          path: dist/SystemArchitecture.exe
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════
  #  RELEASE  (only on version tags like v1.0.0)
  # ═══════════════════════════════════════════════════════════════
  release:
    name: 📦 Create Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Explicit write permission on contents so GITHUB_TOKEN can
    # create a Release and upload assets.
    permissions:
      contents: write

    steps:
      - name: 📥 Download all build artifacts
        uses: actions/download-artifact@v4

      # Uses the official GitHub CLI (gh) which is pre-installed on
      # every runner — no third-party action, no Node version worries.
      - name: 📦 Create Release & upload binaries
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            SystemArchitecture-Linux/SystemArchitecture \
            SystemArchitecture-Windows/SystemArchitecture.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
